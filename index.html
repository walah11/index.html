<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KBS 2TV 주말드라마 <사랑이 온다> 본방사수 이벤트</title>

  <!-- Google Publisher Tag (GPT) 라이브러리 -->
  <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>

  <style>
    :root {
      --kbs-blue: #0056b3;
      --kbs-dark: #1e293b;
      --bg-gray: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-gray);
      color: #333333;
    }

    .kbs-header {
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .kbs-logo {
      font-weight: 900;
      font-size: 1.4rem;
      color: var(--kbs-blue);
      text-decoration: none;
    }

    .kbs-nav { display: flex; gap: 20px; list-style: none; }
    .kbs-nav a { text-decoration: none; color: #475569; font-weight: 600; font-size: 0.95rem; }

    .event-main-container {
      width: 100%;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .event-card {
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(225, 235, 245, 0.8);
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #f0f4f8;
      overflow: hidden;
    }

    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(43, 108, 176, 0.85);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }

    .event-content { padding: 32px 28px; text-align: center; }
    .sub-title { display: block; font-size: 14px; color: #5a789a; font-weight: 600; margin-bottom: 6px; }
    .main-title { font-size: 24px; color: #1a202c; font-weight: 700; margin-bottom: 12px; }
    .event-desc { font-size: 15px; color: #4a5568; line-height: 1.6; margin-bottom: 24px; }

    .prize-box {
      background: #f4f8fc;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 28px;
      display: inline-block;
      width: 100%;
    }

    .prize-item { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; }
    .prize-tag { font-weight: 700; color: #2b6cb0; }
    .prize-name { color: #2d3748; font-weight: 600; }

    .btn-watch-ad {
      width: 100%;
      max-width: 360px;
      height: 56px;
      background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(49, 130, 206, 0.35);
      transition: all 0.2s ease;
    }

    .btn-watch-ad:hover {
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      transform: translateY(-2px);
    }

    .notice-text { font-size: 12px; color: #a0aec0; margin-top: 14px; }

    .kbs-event-poster-container {
      display: none;
      width: 100%;
      margin-top: 20px;
      text-align: center;
      animation: fadeIn 0.6s ease-in-out;
    }

    .kbs-event-poster-container img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .kbs-footer {
      background-color: #1e293b;
      color: #94a3b8;
      text-align: center;
      padding: 30px 20px;
      font-size: 0.85rem;
      margin-top: 60px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header class="kbs-header">
    <a href="#" class="kbs-logo">KBS</a>
    <ul class="kbs-nav">
      <li><a href="#">편성표</a></li>
      <li><a href="#">드라마</a></li>
      <li><a href="#">예능</a></li>
      <li><a href="#">이벤트</a></li>
    </ul>
  </header>

  <main class="event-main-container">
    <section class="event-card">
      <div class="poster-wrapper">
        <img src="image_51b8dc.png" alt="사랑이 온다 메인 포스터" class="poster-img" />
        <div class="badge">이벤트 진행 중</div>
      </div>

      <div class="event-content">
        <span class="sub-title">KBS 2TV 주말드라마</span>
        <h2 class="main-title">&lt;사랑이 온다&gt; 본방사수 응모 이벤트</h2>
        <p class="event-desc">
          짧은 광고를 시청하시면 이벤트 응모가 완료됩니다.<br>
          추첨을 통해 매일 다양한 선물을 드립니다!
        </p>

        <div class="prize-box">
          <div class="prize-item">
            <span class="prize-tag">🎁 이벤트 경품</span>
            <span class="prize-name">스타벅스 아메리카노 / 모바일 상품권</span>
          </div>
        </div>

        <button id="reward-ad-btn" class="btn-watch-ad" onclick="showRewardedAd()">
          <span>▶</span>
          <span id="btn-text">광고 시청하고 응모하기</span>
        </button>
        
        <p class="notice-text">* 광고 시청을 완료하면 응모 완료 포스터가 노출됩니다.</p>
      </div>
    </section>

    <div id="kbs-event-poster-box" class="kbs-event-poster-container">
      <img src="event_poster.png" alt="이벤트 응모 완료 포스터">
    </div>
  </main>

  <footer class="kbs-footer">
    <p>Copyright ⓒ KBS Media All rights reserved.</p>
  </footer>

  <script>
    window.googletag = window.googletag || {cmd: []};

    let rewardedSlot;
    let makeRewardedVisibleFn = null;

    googletag.cmd.push(function() {
      rewardedSlot = googletag.defineOutOfPageSlot(
        '/22056527556/reward_banner',
        googletag.enums.OutOfPageFormat.REWARDED
      );

      if (rewardedSlot) {
        rewardedSlot.addService(googletag.pubads());

        googletag.pubads().addEventListener('rewardedSlotReady', function(evt) {
          console.log('[GPT] 웹 보상형 광고 준비 완료!');
          makeRewardedVisibleFn = evt.makeRewardedVisible;
        });

        googletag.pubads().addEventListener('rewardedSlotGranted', function(evt) {
          console.log('[GPT] 광고 시청 완료: 보상 승인');
          grantKbsReward();
        });

        googletag.pubads().addEventListener('rewardedSlotClosed', function(evt) {
          console.log('[GPT] 보상형 광고 닫힘');
          googletag.destroySlots([rewardedSlot]);
        });

        googletag.enableServices();
        googletag.display(rewardedSlot);
      }
    });

    function showRewardedAd() {
      if (typeof makeRewardedVisibleFn === 'function') {
        makeRewardedVisibleFn();
      } else {
        console.warn('[GPT] 광고가 준비되지 않았거나 No Fill 상태입니다. 예외 응모를 진행합니다.');
        grantKbsReward();
      }
    }

    function grantKbsReward() {
      const imageBox = document.getElementById('kbs-event-poster-box');
      if (imageBox) {
        imageBox.style.display = 'block';
        imageBox.scrollIntoView({ behavior: 'smooth' });
      }
    }
  </script>
</body>
</html>
