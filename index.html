<!-- ======================================================== -->
<!-- [KBS 이벤트 페이지 내 삽입용 - 리워드 광고 모달 & 버튼 코드] -->
<!-- ======================================================== -->

<!-- 1. Google Publisher Tag (GPT) 스크립트 (상단 head 영역 또는 본문 상단에 추가) -->
<script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>

<style>
  /* KBS 이벤트 영역에 맞춘 버튼 스타일링 */
  .kbs-reward-action-area {
    text-align: center;
    margin: 30px 0;
  }

  .btn-kbs-reward {
    background-color: #1e3a8a;
    color: #ffffff;
    border: none;
    padding: 16px 36px;
    font-size: 1.15rem;
    font-weight: 700;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(30, 58, 138, 0.3);
    transition: all 0.2s ease;
    width: 100%;
    max-width: 340px;
  }

  .btn-kbs-reward:hover {
    background-color: #1e40af;
    transform: translateY(-2px);
  }

  /* 오버레이 광고 모달 스타일 */
  .ad-modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    z-index: 99999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  .ad-modal-content {
    background: #ffffff;
    width: 90%;
    max-width: 480px;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }

  .ad-header {
    background: #1e293b;
    color: #ffffff;
    padding: 12px 16px;
    font-size: 0.9rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .ad-body {
    padding: 30px 20px;
    min-height: 250px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: #f8fafc;
  }

  .ad-timer-badge {
    background: #ef4444;
    color: #ffffff;
    font-size: 0.85rem;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: bold;
  }

  .btn-close-ad {
    background: #22c55e;
    color: #ffffff;
    border: none;
    padding: 12px 24px;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 15px;
    display: none;
  }

  /* 광고 시청 완료 후 노출될 이벤트 포스터 영역 */
  .kbs-event-poster-container {
    display: none;
    width: 100%;
    margin-top: 20px;
    text-align: center;
    animation: fadeIn 0.6s ease-in-out;
  }

  .kbs-event-poster-container img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<!-- 2. '광고테스트' 문구 위치에 들어갈 HTML 요소 -->
<div id="kbs-reward-gate-box" class="kbs-reward-action-area">
  <button id="reward-btn" class="btn-kbs-reward" onclick="startKbsAdFlow()">
    광고 보고 응모하기
  </button>
</div>

<!-- 3. 광고 시청 완료 시 표시될 이벤트 콘텐츠/포스터 영역 -->
<div id="kbs-event-poster-box" class="kbs-event-poster-container">
  <img src="event_poster.png" alt="이벤트 응모 포스터">
</div>

<!-- 4. 보상형 광고 모달 구조 -->
<div id="kbs-ad-modal" class="ad-modal-overlay">
  <div class="ad-modal-content">
    <div class="ad-header">
      <span>스폰서 광고</span>
      <span id="ad-timer" class="ad-timer-badge">광고 시청 중 (5초)</span>
    </div>
    <div class="ad-body">
      <!-- GAM 실제 광고 슬롯 -->
      <div id="gpt-rewarded-slot"></div>
      <button id="ad-complete-btn" class="btn-close-ad" onclick="grantKbsReward()">
        시청 완료! 응모하기
      </button>
    </div>
  </div>
</div>

<!-- 5. GPT 정의 및 스크립트 로직 -->
<script>
  window.googletag = window.googletag || {cmd: []};

  let countdown = 5;
  let timerId = null;

  googletag.cmd.push(function() {
    // KBS GAM 광고 단위 경로 (/22056527556/reward_banner) 적용
    googletag.defineSlot('/22056527556/reward_banner', [[300, 250], [1, 1], 'fluid'], 'gpt-rewarded-slot')
             .addService(googletag.pubads());
    googletag.enableServices();
  });

  // 버튼 클릭 시 모달 열기 및 광고 호출
  function startKbsAdFlow() {
    document.getElementById('kbs-ad-modal').style.display = 'flex';
    
    googletag.cmd.push(function() {
      googletag.display('gpt-rewarded-slot');
    });

    countdown = 5;
    const timerBadge = document.getElementById('ad-timer');
    const completeBtn = document.getElementById('ad-complete-btn');
    
    timerBadge.style.display = 'inline-block';
    completeBtn.style.display = 'none';
    timerBadge.textContent = `광고 시청 중 (${countdown}초)`;

    timerId = setInterval(function() {
      countdown--;
      if (countdown > 0) {
        timerBadge.textContent = `광고 시청 중 (${countdown}초)`;
      } else {
        clearInterval(timerId);
        timerBadge.style.display = 'none';
        completeBtn.style.display = 'block';
      }
    }, 1000);
  }

  // 시청 완료 후 보상 지급 (게이트 숨김 및 포스터 오픈)
  function grantKbsReward() {
    document.getElementById('kbs-ad-modal').style.display = 'none';
    document.getElementById('kbs-reward-gate-box').style.display = 'none';
    
    const imageBox = document.getElementById('kbs-event-poster-box');
    imageBox.style.display = 'block';
    imageBox.scrollIntoView({ behavior: 'smooth' });
  }
</script>
