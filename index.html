<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KBS 이벤트 메인</title>

  <!-- Google Publisher Tag (GPT) 라이브러리 -->
  <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js" crossorigin="anonymous"></script>
  <script>
    window.googletag = window.googletag || {cmd: []};
    
    googletag.cmd.push(function() {
      var slot = googletag.defineSlot('/22056527556/interad', [[640, 480], [300, 250], [300, 500], [800, 600], [320, 480]], 'div-gpt-ad-1786426722536-0')
               .addService(googletag.pubads());

      // 광고 렌더링 완료 감지 이벤트
      googletag.pubads().addEventListener('slotRenderEnded', function(event) {
        if (event.slot === slot) {
          var modal = document.getElementById('interstitialModal');
          
          // 1. 광고가 없는 경우 (No Fill / isEmpty) 팝업 감추기
          if (event.isEmpty) {
            if (modal) modal.style.display = 'none';
          } else {
            // 2. 광고가 정상 노출되면 팝업을 띄우고 2초 카운트다운 시작
            if (modal) modal.style.display = 'flex';
            startCloseTimer(2);
          }
        }
      });

      googletag.setConfig({singleRequest: true});
      googletag.enableServices();
    });

    // 2초 카운트다운 및 X 버튼 전환 로직
    function startCloseTimer(seconds) {
      var closeBtn = document.getElementById('closeBtn');
      if (!closeBtn) return;

      closeBtn.disabled = true;
      closeBtn.classList.remove('active');
      var timeLeft = seconds;
      closeBtn.innerText = timeLeft + 's';

      var timer = setInterval(function() {
        timeLeft--;
        if (timeLeft > 0) {
          closeBtn.innerText = timeLeft + 's';
        } else {
          clearInterval(timer);
          closeBtn.innerText = '×';
          closeBtn.disabled = false;
          closeBtn.classList.add('active');
        }
      }, 1000);
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #111111;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 본문 포스터 */
    .event-page-container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .event-poster-img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      display: block;
    }

    /* 전면 배너 모달 오버레이 (초기 상태 숨김) */
    .interstitial-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.8);
      display: none; /* 광고 로드 확인 전까지 팝업을 숨겨둡니다 */
      justify-content: center;
      align-items: center;
      z-index: 999999;
    }

    .interstitial-container {
      position: relative;
      display: inline-block;
      max-width: 95vw;
      max-height: 95vh;
    }

    .ad-slot-wrapper {
      display: inline-block;
      border-radius: 8px;
      overflow: hidden;
      background-color: #000000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    #div-gpt-ad-1786426722536-0 {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      width: auto !important;
      height: auto !important;
    }

    #div-gpt-ad-1786426722536-0 iframe {
      border: none !important;
      display: block !important;
    }

    /* 카운트다운 및 닫기 버튼 스타일 */
    .close-btn {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 32px;
      height: 32px;
      background-color: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      border: 1px solid #ffffff;
      border-radius: 50%;
      font-size: 13px;
      font-weight: bold;
      cursor: not-allowed;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      z-index: 1000000;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
    }

    /* 2초 후 활성화되었을 때 버튼 스타일 */
    .close-btn.active {
      background-color: #ffffff;
      color: #000000;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    .bottom-bar {
      margin-top: 10px;
      text-align: center;
    }

    .bottom-bar button {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 본문 포스터 -->
  <div class="event-page-container">
    <img src="event_poster.png" alt="이벤트 포스터" class="event-poster-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/800x1200?text=event_poster.png+Not+Found';">
  </div>

  <!-- 전면 배너 모달 -->
  <div id="interstitialModal" class="interstitial-overlay">
    <div class="interstitial-container">
      <!-- 2초 타이머 닫기 버튼 -->
      <button type="button" id="closeBtn" class="close-btn" onclick="closeBanner()" disabled>2s</button>
      
      <div class="ad-slot-wrapper">
        <div id='div-gpt-ad-1786426722536-0'>
          <script>
            googletag.cmd.push(function() { 
              googletag.display('div-gpt-ad-1786426722536-0');
            });
          </script>
        </div>
      </div>

      <div class="bottom-bar">
        <button type="button" onclick="closeBannerToday()">오늘 하루 보지 않기</button>
      </div>
    </div>
  </div>

  <script>
    function closeBanner() {
      var closeBtn = document.getElementById('closeBtn');
      if (closeBtn && closeBtn.disabled) return; // 2초 전 클릭 방지
      
      var modal = document.getElementById('interstitialModal');
      if (modal) {
        modal.style.display = 'none';
      }
    }

    function closeBannerToday() {
      const expiry = new Date().getTime() + (24 * 60 * 60 * 1000);
      localStorage.setItem('hideEntryBannerUntil', expiry);
      
      var modal = document.getElementById('interstitialModal');
      if (modal) modal.style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', function() {
      const hideUntil = localStorage.getItem('hideEntryBannerUntil');
      if (hideUntil && new Date().getTime() < parseInt(hideUntil)) {
        var modal = document.getElementById('interstitialModal');
        if (modal) modal.style.display = 'none';
      }
    });
  </script>

</body>
</html>
