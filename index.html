<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사랑이 온다 퀴즈 EVENT</title>
  
  <!-- Google Publisher Tag (GPT) -->
  <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
  
  <style>
    :root {
      --primary-color: #2b4c7e;
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --text-main: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      text-align: center;
    }

    .header-box {
      padding: 40px 20px;
      background: linear-gradient(135deg, #2b4c7e 0%, #4a76a8 100%);
      color: #fff;
    }

    .header-box h1 {
      font-size: 1.6rem;
      margin-bottom: 10px;
      word-break: keep-all;
    }

    .header-box p {
      font-size: 0.95rem;
      opacity: 0.9;
      line-height: 1.5;
    }

    .action-area {
      padding: 30px 20px;
    }

    .btn-submit {
      background-color: #1e3a8a;
      color: #ffffff;
      border: none;
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(30, 58, 138, 0.3);
      transition: all 0.2s ease;
      width: 100%;
      max-width: 320px;
    }

    .btn-submit:hover {
      background-color: #1e40af;
      transform: translateY(-2px);
    }

    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .reward-image-container {
      display: none;
      width: 100%;
      animation: fadeIn 0.6s ease-in-out;
    }

    .reward-image-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="gate-box">
      <div class="header-box">
        <h1>KBS 2TV 주말드라마 &lt;사랑이 온다&gt;</h1>
        <p>광고를 시청하시면 이벤트 응모 페이지가 열립니다.</p>
      </div>
      
      <div class="action-area">
        <button id="reward-btn" class="btn-submit" disabled onclick="handleButtonClick()">
          광고 로딩 중...
        </button>
      </div>
    </div>

    <div id="event-image-box" class="reward-image-container">
      <img src="event_poster.png" alt="사랑이 온다 퀴즈 EVENT 포스터">
    </div>
  </div>

  <script>
    window.googletag = window.googletag || {cmd: []};

    let rewardedSlot;
    let isAdReady = false;
    let isSupported = true;

    googletag.cmd.push(function() {
      // 1. defineRewardedSlot 지원 여부 안전성 검사
      if (typeof googletag.defineRewardedSlot === 'function') {
        rewardedSlot = googletag.defineRewardedSlot(
          '/22056527556/reward_banner',
          [[1, 1]]
        ).addService(googletag.pubads());

        // 시청 완료 이벤트
        googletag.pubads().addEventListener('rewardedSlotGranted', function(event) {
          console.log('Reward granted!');
          unlockEventContent();
        });

        // 준비 완료 이벤트
        googletag.pubads().addEventListener('rewardedSlotReady', function(event) {
          console.log('Rewarded slot is ready.');
          isAdReady = true;
          const btn = document.getElementById('reward-btn');
          btn.disabled = false;
          btn.textContent = '광고 보고 응모하기';
        });

        // 닫힘 이벤트
        googletag.pubads().addEventListener('rewardedSlotClosed', function(event) {
          if (rewardedSlot) {
            googletag.destroySlots([rewardedSlot]);
          }
        });

        googletag.enableServices();
        googletag.display(rewardedSlot);
      } else {
        // PC 브라우저 등 웹 보상형 광고 미지원 환경 처리
        console.warn('The current environment does not support rewarded web ads.');
        isSupported = false;
        enableFallback();
      }
    });

    // 버튼 클릭 처리
    function handleButtonClick() {
      if (!isSupported) {
        // 미지원 환경일 경우 바로 이미지 노출
        unlockEventContent();
        return;
      }

      if (isAdReady && rewardedSlot) {
        googletag.cmd.push(function() {
          rewardedSlot.makeRewardedVisible();
        });
      } else {
        alert('광고를 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
      }
    }

    // 미지원 환경 시 버튼 활성화 및 스킵 모드 전환
    function enableFallback() {
      const btn = document.getElementById('reward-btn');
      btn.disabled = false;
      btn.textContent = '응모 페이지 열기';
    }

    // 콘텐츠 잠금 해제 (포스터 노출)
    function unlockEventContent() {
      document.getElementById('gate-box').style.display = 'none';
      const imageBox = document.getElementById('event-image-box');
      imageBox.style.display = 'block';
      imageBox.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
