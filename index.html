<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지 진입 전면 배너</title>

  <!-- Google Publisher Tag (GPT) 라이브러리 -->
  <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js" crossorigin="anonymous"></script>
  <script>
    window.googletag = window.googletag || {cmd: []};
    googletag.cmd.push(function() {
      // 지정해주신 GAM 광고 단위 (/22056527556/interad) 및 멀티 크기 설정
      googletag.defineSlot('/22056527556/interad', [[640, 480], [300, 250], [300, 500], [800, 600], [320, 480]], 'div-gpt-ad-1786426722536-0')
               .addService(googletag.pubads());
      
      googletag.pubads().enableSingleRequest();
      googletag.enableServices();
    });
  </script>

  <style>
    /* 기본 스타일 초기화 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 전면 오버레이 배경 */
    .interstitial-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }

    /* 모달 컨테이너 */
    .interstitial-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 95vw;
      max-height: 95vh;
    }

    /* 광고 슬롯 영역 */
    .ad-slot-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-radius: 8px;
      background-color: #000000;
    }

    /* 닫기 버튼 */
    .close-btn {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 32px;
      height: 32px;
      background-color: #ffffff;
      color: #333333;
      border: none;
      border-radius: 50%;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      z-index: 100000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 하단 옵션 바 */
    .bottom-bar {
      margin-top: 10px;
      display: flex;
      gap: 15px;
    }

    .bottom-bar button {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
    }

    .bottom-bar button:hover {
      color: #cccccc;
    }
  </style>
</head>
<body>

  <!-- 전면 배너 모달 레이어 -->
  <div id="interstitialModal" class="interstitial-overlay">
    <div class="interstitial-container">
      <!-- 상단 닫기 버튼 -->
      <button type="button" class="close-btn" onclick="closeBanner()">&times;</button>
      
      <!-- GAM 광고 출력 Div -->
      <div class="ad-slot-wrapper">
        <div id='div-gpt-ad-1786426722536-0' style='min-width: 300px; min-height: 250px;'>
          <script>
            googletag.cmd.push(function() { googletag.display('div-gpt-ad-1786426722536-0'); });
          </script>
        </div>
      </div>

      <!-- 하단 옵션 바 -->
      <div class="bottom-bar">
        <button type="button" onclick="closeBannerToday()">오늘 하루 보지 않기</button>
      </div>
    </div>
  </div>

  <script>
    function closeBanner() {
      document.getElementById('interstitialModal').style.display = 'none';
    }

    function closeBannerToday() {
      // 24시간 쿠키/LocalStorage 설정
      const expiry = new Date().getTime() + (24 * 60 * 60 * 1000);
      localStorage.setItem('hideEntryBannerUntil', expiry);
      closeBanner();
    }

    // 페이지 진입 시 노출 여부 체크 및 제어
    document.addEventListener('DOMContentLoaded', function() {
      const hideUntil = localStorage.getItem('hideEntryBannerUntil');
      if (hideUntil && new Date().getTime() < parseInt(hideUntil)) {
        document.getElementById('interstitialModal').style.display = 'none';
      }
    });
  </script>

</body>
</html>
