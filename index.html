<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사랑이 온다 퀴즈 EVENT</title>
  
  <!-- Google Publisher Tag (GPT) -->
  <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
  
  <style>
    :root {
      --primary-color: #2b4c7e;
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --text-main: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      text-align: center;
    }

    .header-box {
      padding: 40px 20px;
      background: linear-gradient(135deg, #2b4c7e 0%, #4a76a8 100%);
      color: #fff;
    }

    .header-box h1 {
      font-size: 1.6rem;
      margin-bottom: 10px;
      word-break: keep-all;
    }

    .header-box p {
      font-size: 0.95rem;
      opacity: 0.9;
      line-height: 1.5;
    }

    .action-area {
      padding: 30px 20px;
    }

    .btn-submit {
      background-color: #1e3a8a;
      color: #ffffff;
      border: none;
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(30, 58, 138, 0.3);
      transition: all 0.2s ease;
      width: 100%;
      max-width: 320px;
    }

    .btn-submit:hover {
      background-color: #1e40af;
      transform: translateY(-2px);
    }

    /* 보상형 광고 오버레이 모달 */
    .ad-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .ad-modal-content {
      background: #ffffff;
      width: 90%;
      max-width: 480px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .ad-header {
      background: #1e293b;
      color: #ffffff;
      padding: 12px 16px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ad-body {
      padding: 30px 20px;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #f8fafc;
    }

    .ad-timer-badge {
      background: #ef4444;
      color: #ffffff;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: bold;
    }

    .btn-close-ad {
      background: #22c55e;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
      display: none;
    }

    /* 광고 시청 후 나타날 포스터 영역 */
    .reward-image-container {
      display: none;
      width: 100%;
      animation: fadeIn 0.6s ease-in-out;
    }

    .reward-image-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="gate-box">
      <div class="header-box">
        <h1>KBS 2TV 주말드라마 &lt;사랑이 온다&gt;</h1>
        <p>광고를 시청하시면 이벤트 응모 페이지가 열립니다.</p>
      </div>
      
      <div class="action-area">
        <button id="reward-btn" class="btn-submit" onclick="startAdFlow()">
          광고 보고 응모하기
        </button>
      </div>
    </div>

    <!-- 이벤트 포스터 영역 -->
    <div id="event-image-box" class="reward-image-container">
      <img src="event_poster.png" alt="사랑이 온다 퀴즈 EVENT 포스터">
    </div>
  </div>

  <!-- 보상형 광고 모달 -->
  <div id="ad-modal" class="ad-modal-overlay">
    <div class="ad-modal-content">
      <div class="ad-header">
        <span>스폰서 광고</span>
        <span id="ad-timer" class="ad-timer-badge">광고 시청 중 (5초)</span>
      </div>
      <div class="ad-body">
        <!-- GAM 실제 광고 슬롯 영역 -->
        <div id="gpt-rewarded-slot"></div>
        <button id="ad-complete-btn" class="btn-close-ad" onclick="grantReward()">
          시청 완료! 응모하기
        </button>
      </div>
    </div>
  </div>

  <script>
    window.googletag = window.googletag || {cmd: []};

    let countdown = 5;
    let timerId = null;

    googletag.cmd.push(function() {
      // 본인 GAM 광고 단위 경로 (/22056527556/reward_banner) 적용
      googletag.defineSlot('/22056527556/reward_banner', [[300, 250], [1, 1], 'fluid'], 'gpt-rewarded-slot')
               .addService(googletag.pubads());
      googletag.enableServices();
    });

    // 광고 모달 열기 및 카운트다운 시작
    function startAdFlow() {
      document.getElementById('ad-modal').style.display = 'flex';
      
      googletag.cmd.push(function() {
        googletag.display('gpt-rewarded-slot');
      });

      countdown = 5;
      const timerBadge = document.getElementById('ad-timer');
      const completeBtn = document.getElementById('ad-complete-btn');
      
      timerBadge.style.display = 'inline-block';
      completeBtn.style.display = 'none';
      timerBadge.textContent = `광고 시청 중 (${countdown}초)`;

      timerId = setInterval(function() {
        countdown--;
        if (countdown > 0) {
          timerBadge.textContent = `광고 시청 중 (${countdown}초)`;
        } else {
          clearInterval(timerId);
          timerBadge.style.display = 'none';
          completeBtn.style.display = 'block';
        }
      }, 1000);
    }

    // 광고 완료 후 보상 지급 (포스터 노출)
    function grantReward() {
      document.getElementById('ad-modal').style.display = 'none';
      document.getElementById('gate-box').style.display = 'none';
      
      const imageBox = document.getElementById('event-image-box');
      imageBox.style.display = 'block';
      imageBox.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
